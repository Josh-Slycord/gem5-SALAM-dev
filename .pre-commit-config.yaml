# Only maintained workbench code and configuration are checked here.
# Historical gem5 and SALAM files retain their own provenance and style.
minimum_pre_commit_version: '3.5.0'

files: '^(workbench/(salam_workbench/|tests/|scripts/|experiments/|docs/|README\.md|requirements[^/]*\.txt|workbench\.ps1|pyproject\.toml)|\.github/(workflows/ci\.yml|requirements-ci(?:-gem5-26)?\.txt)|\.pre-commit-config\.yaml|docs/CI\.md)'
exclude: '^workbench/(salam_workbench/vendor/|experiments/regression/overlays/|docs/patches/|docs/ci/legacy-)'

repos:
  - repo: local
    hooks:
      - id: workbench-black
        name: Black on maintained workbench Python
        entry: black --config workbench/pyproject.toml --check --diff
        language: system
        types: [python]
        files: '^workbench/(salam_workbench|tests|scripts)/.*\.py$'

      - id: workbench-isort
        name: isort on maintained workbench Python
        entry: isort --settings-path workbench/pyproject.toml --check-only --diff
        language: system
        types: [python]
        files: '^workbench/(salam_workbench|tests|scripts)/.*\.py$'

      - id: workbench-python-syntax
        name: Parse maintained workbench Python
        entry: check-ast
        language: system
        types: [python]
        files: '^workbench/(salam_workbench|tests|scripts)/.*\.py$'

      - id: workbench-json-syntax
        name: Parse maintained workbench JSON
        entry: check-json
        language: system
        types: [json]
        files: '^workbench/(experiments|docs/planning)/.*\.json$'

      - id: workbench-yaml-syntax
        name: Parse maintained CI and experiment YAML
        entry: check-yaml
        args: [--allow-multiple-documents]
        language: system
        types: [yaml]
        files: '^(\.github/workflows/ci\.yml|\.pre-commit-config\.yaml|workbench/experiments/.*\.ya?ml)$'

      - id: workbench-toml-syntax
        name: Parse workbench formatter settings
        entry: check-toml
        language: system
        types: [toml]
        files: '^workbench/pyproject\.toml$'

      - id: maintained-eof
        name: Final newline in maintained text
        entry: end-of-file-fixer
        language: system
        types: [text]

      - id: maintained-trailing-whitespace
        name: No accidental trailing whitespace in maintained text
        entry: trailing-whitespace-fixer
        args: [--markdown-linebreak-ext=md]
        language: system
        types: [text]

      - id: maintained-line-endings
        name: LF line endings in maintained Python and new CI files
        entry: mixed-line-ending
        args: [--fix=lf]
        language: system
        types: [text]
        files: '^(workbench/(salam_workbench|tests|scripts)/.*\.py|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml|docs/CI\.md)$'
