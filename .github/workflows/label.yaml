---
name: Pull Request Labeler

on:
    - pull_request_target

jobs:
    label:
        if: github.repository == 'gem5/gem5'
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            pull-requests: write

        steps:
            - uses: actions/labeler@v6
              id: label
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
